<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff41"/>
      <stop offset="100%" style="stop-color:#00cc33"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00ff41" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Gird -->
  <g stroke="#00ff41" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="40" y1="0" x2="40" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="440" y1="0" x2="440" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="520" y1="0" x2="520" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="680" y1="0" x2="680" y2="400"/>
    <line x1="720" y1="0" x2="720" y2="400"/>
    <line x1="760" y1="0" x2="760" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="840" y1="0" x2="840" y2="400"/>
    <line x1="880" y1="0" x2="880" y2="400"/>
    <line x1="920" y1="0" x2="920" y2="400"/>
    <line x1="960" y1="0" x2="960" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1040" y1="0" x2="1040" y2="400"/>
    <line x1="1080" y1="0" x2="1080" y2="400"/>
    <line x1="1120" y1="0" x2="1120" y2="400"/>
    <line x1="1160" y1="0" x2="1160" y2="400"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="80" cy="80" r="50" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.15"/>
  <circle cx="80" cy="80" r="30" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.2"/>
  <circle cx="1120" cy="320" r="70" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.1"/>
  <circle cx="1120" cy="320" r="40" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.15"/>
  <circle cx="1050" cy="80" r="25" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.2"/>
  <circle cx="150" cy="350" r="35" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.1"/>

  <!-- Shield icon -->
  <g transform="translate(180, 200)">
    <path d="M-10,-50 L50,-90 L110,-50 L110,20 Q110,60 50,100 Q-10,60 -10,20 Z" 
          fill="none" stroke="#00ff41" stroke-width="2.5" opacity="0.8"/>
    <path d="M-10,-50 L50,-90 L110,-50 L110,20 Q110,60 50,100 Q-10,60 -10,20 Z" 
          fill="#00ff41" opacity="0.05"/>
    <path d="M50,-70 L50,80" stroke="#00ff41" stroke-width="2" opacity="0.6"/>
    <path d="M30,40 L70,40" stroke="#00ff41" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Particles -->
  <circle cx="300" cy="100" r="2" fill="#00ff41" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="300" r="3" fill="#00ff41" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="150" r="2" fill="#00ff41" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="250" r="3" fill="#00ff41" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="100" r="2" fill="#00ff41" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Heading SHADOW -->
  <text x="600" y="180" font-family="'Courier New', monospace" font-size="56" font-weight="900" 
        fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="8">
    SHADOW
  </text>

  <!-- Heading CONTROL -->
  <text x="600" y="240" font-family="'Courier New', monospace" font-size="56" font-weight="900" 
        fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="8">
    CONTROL
  </text>

  <!-- The subtitle -->
  <text x="600" y="290" font-family="'Courier New', monospace" font-size="18" 
        fill="#a8b2c1" text-anchor="middle" letter-spacing="3">
    Encrypted Reverse Shell Framework • Military-Grade Security
  </text>

  <!-- Separator -->
  <rect x="400" y="310" width="400" height="1.5" fill="#00ff41" opacity="0.3"/>
  <rect x="450" y="312" width="300" height="1" fill="#00ff41" opacity="0.15"/>

  <!-- Technologies -->
  <text x="600" y="345" font-family="'Courier New', monospace" font-size="13" 
        fill="#666666" text-anchor="middle" letter-spacing="2">
    AES-256-GCM • RSA-2048 • Multi-Client • Anti-Forensics • Cross-Platform
  </text>

  <!-- Corner decorations -->
  <path d="M20,60 L20,20 L60,20" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.4"/>
  <path d="M1180,60 L1180,20 L1140,20" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.4"/>
  <path d="M20,340 L20,380 L60,380" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.4"/>
  <path d="M1180,340 L1180,380 L1140,380" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.4"/>
</svg>
